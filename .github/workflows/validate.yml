name: validate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: community adapter regressions
        run: node --experimental-vm-modules --test tests/community.test.mjs tests/runtime.test.mjs
      - name: validate packages and the signed registry
        run: node scripts/validate.mjs --check
